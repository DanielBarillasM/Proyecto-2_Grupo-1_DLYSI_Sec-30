project:
  name: "Eryndor: Guardianes del Velo"
  image_size: 64
  channels: 3
  dataset_size: 4096
  dataset_seed: 2026

training:
  latent_dim: 128
  generator_features: 64
  discriminator_features: 64
  batch_size: 64
  epochs: 60
  learning_rate_g: 0.0002
  learning_rate_d: 0.0002
  beta1: 0.5
  beta2: 0.999
  model_seed: 42
  fixed_noise_seed: 777
  checkpoint_every: 5
  sample_every: 5

smoke_test:
  batch_size: 8
  steps: 8
  sample_count: 16

gallery:
  candidate_count: 200
  final_count: 10
  seed: 20261011
  selection_rate: 0.05
  feature_extractor: "resnet18_imagenet1k_v1"
  generation_device: "cpu"
  background_rgb: [23, 26, 36]

experiments:
  - id: baseline_bce
    loss: bce_non_saturating
    spectral_norm_discriminator: false
  - id: hinge_loss
    loss: hinge
    spectral_norm_discriminator: false
  - id: bce_spectral_norm
    loss: bce_non_saturating
    spectral_norm_discriminator: true
